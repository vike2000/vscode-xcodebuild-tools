<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Storyboard</title>
		
		<!-- Use a content security policy to only allow loading images from https or from our extension directory, and only allow scripts that have a specific nonce. -->
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${webview.cspSource}; font-src ${webview.cspSource}; style-src 'unsafe-inline' ${webview.cspSource}; script-src 'unsafe-eval' 'unsafe-inline' 'nonce-${nonce}';">
		
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<link rel="stylesheet" href="${uri('codicons')}"			/>
		<link rel="stylesheet" href="${uri('fontAwesome')}"			/>
		<!--<link rel="stylesheet" href="${uri('commonStyleReset')}"	/>-->
		<!--<link rel="stylesheet" href="${uri('commonStyleVSCode')}"	/>-->
		<!--<link rel="stylesheet" href="${uri('specificStyle')}"		/>-->
		
		<style>			*												{			box-sizing					:		content-box
																		;	 background							:		none
			}			html											{				height					: 100%
			}			html
			,			body>*											{		 margin							:	0
			}			body											{		padding							:	0
																		;				height					: 100%
																		;		   font-size					:  10px
																		;				color					:				rgba(127, 127, 127, 100%)
																		;				display					:		grid
																		;		   grid							:	"		toolbar			toolbar			toolbar	"	var(--toolbar-height)
																													"		canvas			sizer			right	"	auto
																													/		1fr				auto	  var(--right-width)
																		;																				  --right-width						:200px
																		;																									--toolbar-height: 32px
			}			body
			,			canvas											{		-webkit-overflow-scrolling		:		none
																		;				overscroll-behavior		:		none
			}			 div.key										{		 margin-left					:   2px
																		;		   font-size					:  20px
			}			 i.fa-solid										{		   font-size					:  16px
			}			input[type=radio]								{		 margin-left					:   0
			}			#toolbar>*										{				font-size				:														var(--toolbar-height)
			}			#toolbar>*:not(:last-child)						{		 border-right					:	1px	solid
			}			#toolbar										{				display					:		flex
																		;		 border-bottom					:	1px	solid
																		;		   grid-area					:		toolbar
			}			#ctr_center>*
			,			#ctr_scroll>*									{		 margin-bottom					:  10px
																		;		 margin-left					:   5px
			}			#right											{		   grid-area					:		right
			}			#container										{		   grid-area					:		canvas
																		;				width					: 100%
																		;				height					: 100%
			}			canvas											{				position				:		absolute
			
			}			 div.key										{				position				:		relative
																		;				top						:  -1px
			
			}			 div.key>.cn>.ms
			,			 div.key>.cn>.ma
			,			 div.key>.cn>.mc
			,			 div.key>.cn>.mm								{				display					:		inline-block
																		;				width					:	1.000rem
			}			 div.key>.cn>.ms
			,			 div.key>.cn>.ma
			,			 div.key>.cn>.mc
			,			 div.key>.cn>.mm
			,			 div.key>.cn>.key>*
			,			span.key										{				font-size				:	1.6000ex
																		;				letter-spacing			:	 .8000ex
																		;				font-family				:"Lucida Grande","Lucida Sans Unicode","Noto Color Emoji","Apple Color Emoji",Symbols,"Apple Symbols",Symbol/*,"Segoe UI Emoji"*/,Times,Symbola,Aegyptus,Code2000,Code2001,Code2002,Musica,emoji,LastResort /* cspell:ignore noto segoe symbola musica */
																		;				font-smoothing			:		auto
																		;		-webkit-font-smoothing			:		auto
																		;	   -moz-osx-font-smoothing			:		auto
																		;				font-smooth				:		auto
																		;				margin					:0	 .2500ex
			}			span.key.big									{				font-size				:	2.8000ex
																		;				margin					:0 -2px
			
			}			 div.key.focused								{				background				:rgba(255,200,0,.4) !important
			
			}			 div.key										{				display					:		inline-flex
		/*	 #ctnr_acts	 div.key… */
			}			 div.key>.cn>.key>*:first-child					{				display					:		inline-block
																		;				width					:	0
																		;				position				:		relative
																		;				left					:	0.6500em /* for:win; has-been:for:mac:0.9500em */
			}			 div.key>.cn>.key>*:last-child					{				display					:		inline-block
																		;				width					:	1.250em
																		;				position				:		relative
																		;				left					:  -0.6250ex
																		;		   text-align					:		center
																		;		 margin-right					:  -0.500em
			}</style></head>
	<body>
		<div		id=toolbar																						>
			<div	id=toolbar_getDocument	class="codicon codicon-refresh	" title='${lang("Reload document…")}'	></div>
			</div>
		<div		id=container																					><canvas></canvas></div>
		<div		id=right																						></div>
		
		<script nonce="${nonce}" src="${uri('min_underscoreScript')}"	></script>
		<script nonce="${nonce}" src="${uri('min_jqueryScript')}"		></script>
		<!--<script nonce="${nonce}" src="${uri('min_bluelephant_tkScript')}"></script>-->
		<script nonce="${nonce}" src="${uri('bluelephant_tkScript')}"	></script>
		<script nonce="${nonce}">__packages.com.dyn_o_saur.bluelephant.js.tk.init('$b')</script>
		<script nonce="${nonce}" src="${uri('specificScript')}"			></script>
	</body>
</html>
